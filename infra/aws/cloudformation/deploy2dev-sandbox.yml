AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal Deploy to Dev sandbox with ECR, ECS on EC2, and a CircleCI deploy policy.

Parameters:
  ProjectName:
    Type: String
    Default: deploy2dev
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{1,31}$"
    Description: Short project name used for resource names.
  ServiceName:
    Type: String
    Default: sample-service
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{1,48}$"
    Description: Test service name.
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the ECS container instance.
  EcsOptimizedAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2/recommended/image_id
    Description: Latest Amazon Linux 2 ECS-optimized AMI from SSM.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.2.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-public-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  EcsInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS container instance security group.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          CidrIp: 0.0.0.0/0
          Description: Sandbox-only dynamic ECS host ports for E2E browser testing.
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-ecs-sg"

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP access to the sandbox sample service.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          CidrIp: 0.0.0.0/0
          Description: Sandbox stage service HTTP access.
        - IpProtocol: tcp
          FromPort: 8082
          ToPort: 8082
          CidrIp: 0.0.0.0/0
          Description: Sandbox prod service HTTP access.
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-alb-sg"

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}/${ServiceName}"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the most recent 50 sandbox images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 50
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-dev"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}/${ServiceName}/dev"
      RetentionInDays: 14

  StageEcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}/${ServiceName}/stage"
      RetentionInDays: 14

  ProdEcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}/${ServiceName}/prod"
      RetentionInDays: 14

  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EcsInstanceRole

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        IamInstanceProfile:
          Arn: !GetAtt EcsInstanceProfile.Arn
        ImageId: !Ref EcsOptimizedAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !Ref EcsInstanceSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            echo "ECS_CLUSTER=${EcsCluster}" >> /etc/ecs/ecs.config
      LaunchTemplateName: !Sub "${ProjectName}-dev-ecs"

  EcsAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      DesiredCapacity: "1"
      HealthCheckGracePeriod: 300
      HealthCheckType: EC2
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MaxSize: "1"
      MinSize: "1"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dev-ecs-node"
          PropagateAtLaunch: true
      VPCZoneIdentifier:
        - !Ref PublicSubnet

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-dev-alb"
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnet
        - !Ref PublicSubnetB
      Type: application

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200-399"
      Name: !Sub "${ProjectName}-${ServiceName}-dev"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref Vpc

  StageTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200-399"
      Name: !Sub "${ProjectName}-${ServiceName}-stage"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref Vpc

  ProdTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200-399"
      Name: !Sub "${ProjectName}-${ServiceName}-prod"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref Vpc

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  StageListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref StageTargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8081
      Protocol: HTTP

  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProdTargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8082
      Protocol: HTTP

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Essential: true
          Image: nginx:alpine
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          MemoryReservation: 128
          Name: app
          PortMappings:
            - ContainerPort: 80
              HostPort: 0
              Protocol: tcp
      Cpu: "256"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Family: !Sub "${ProjectName}-${ServiceName}-dev"
      Memory: "256"
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      TaskRoleArn: !GetAtt TaskRole.Arn

  StageTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Essential: true
          Image: nginx:alpine
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref StageEcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          MemoryReservation: 128
          Name: app
          PortMappings:
            - ContainerPort: 80
              HostPort: 0
              Protocol: tcp
      Cpu: "256"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Family: !Sub "${ProjectName}-${ServiceName}-stage"
      Memory: "256"
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      TaskRoleArn: !GetAtt TaskRole.Arn

  ProdTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Essential: true
          Image: nginx:alpine
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProdEcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          MemoryReservation: 128
          Name: app
          PortMappings:
            - ContainerPort: 80
              HostPort: 0
              Protocol: tcp
      Cpu: "256"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Family: !Sub "${ProjectName}-${ServiceName}-prod"
      Memory: "256"
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      TaskRoleArn: !GetAtt TaskRole.Arn

  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - EcsAutoScalingGroup
      - Listener
    Properties:
      Cluster: !Ref EcsCluster
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: 1
      LaunchType: EC2
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup
      ServiceName: !Sub "${ServiceName}-dev"
      TaskDefinition: !Ref TaskDefinition

  StageEcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - EcsAutoScalingGroup
      - StageListener
    Properties:
      Cluster: !Ref EcsCluster
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: 1
      LaunchType: EC2
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 80
          TargetGroupArn: !Ref StageTargetGroup
      ServiceName: !Sub "${ServiceName}-stage"
      TaskDefinition: !Ref StageTaskDefinition

  ProdEcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - EcsAutoScalingGroup
      - ProdListener
    Properties:
      Cluster: !Ref EcsCluster
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: 1
      LaunchType: EC2
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 80
          TargetGroupArn: !Ref ProdTargetGroup
      ServiceName: !Sub "${ServiceName}-prod"
      TaskDefinition: !Ref ProdTaskDefinition

  CircleCiDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege sandbox policy for CircleCI to push images and update one ECS dev service.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrAuthorization
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: EcrPushToServiceRepository
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:CompleteLayerUpload
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr:InitiateLayerUpload
              - ecr:PutImage
              - ecr:UploadLayerPart
            Resource: !GetAtt EcrRepository.Arn
          - Sid: EcsReadClusterAndService
            Effect: Allow
            Action:
              - ecs:DescribeClusters
              - ecs:DescribeServices
              - ecs:ListTasks
              - ecs:UpdateService
            Resource:
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ProjectName}-dev"
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}-dev/${ServiceName}-dev"
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}-dev/${ServiceName}-stage"
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}-dev/${ServiceName}-prod"
          - Sid: EcsRegisterAndReadTaskDefinitions
            Effect: Allow
            Action:
              - ecs:DescribeTaskDefinition
              - ecs:RegisterTaskDefinition
            Resource:
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-${ServiceName}-dev:*"
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-${ServiceName}-stage:*"
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-${ServiceName}-prod:*"
          - Sid: PassOnlySandboxTaskRoles
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !GetAtt TaskExecutionRole.Arn
              - !GetAtt TaskRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  AwsRegion:
    Value: !Ref AWS::Region
  EcrRepositoryName:
    Value: !Ref EcrRepository
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  EcsClusterName:
    Value: !Ref EcsCluster
  EcsServiceName:
    Value: !GetAtt EcsService.Name
  StageEcsServiceName:
    Value: !GetAtt StageEcsService.Name
  ProdEcsServiceName:
    Value: !GetAtt ProdEcsService.Name
  ServiceUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}"
  StageServiceUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}:8081"
  ProdServiceUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}:8082"
  TaskDefinitionFamily:
    Value: !Sub "${ProjectName}-${ServiceName}-dev"
  StageTaskDefinitionFamily:
    Value: !Sub "${ProjectName}-${ServiceName}-stage"
  ProdTaskDefinitionFamily:
    Value: !Sub "${ProjectName}-${ServiceName}-prod"
  CircleCiDeployPolicyArn:
    Value: !Ref CircleCiDeployPolicy
