version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:stable
    environment:
      ECS_CONTAINER_NAME: app
    steps:
      - checkout
      - setup_remote_docker
      - aws-cli/setup:
          region: AWS_REGION
      - run:
          name: Build and push immutable image tag
          command: |
            set -euo pipefail

            : "${AWS_REGION:?Missing AWS_REGION}"
            : "${ECR_REPOSITORY_URI:?Missing ECR_REPOSITORY_URI}"

            SAFE_BRANCH="$(echo "${CIRCLE_BRANCH:-local}" | tr '/_[:upper:]' '--[:lower:]' | tr -cd 'a-z0-9.-')"
            SHORT_SHA="$(echo "${CIRCLE_SHA1:-unknown}" | cut -c1-7)"
            IMAGE_TAG="${SAFE_BRANCH}-${SHORT_SHA}"
            IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
            ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            docker build -t "${IMAGE_URI}" .
            docker push "${IMAGE_URI}"

            echo "export IMAGE_URI=${IMAGE_URI}" >> "${BASH_ENV}"
            echo "Pushed ${IMAGE_URI}"

workflows:
  deploy2dev-sandbox:
    jobs:
      - build-and-push
