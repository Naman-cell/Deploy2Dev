AWSTemplateFormatVersion: "2010-09-09"
Description: Heimdall Lambda/API/DynamoDB foundation.

Parameters:
  ProjectName:
    Type: String
    Default: heimdall
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package.
  LambdaCodeKey:
    Type: String
    Description: S3 key for the Lambda deployment package.
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret. Use Secrets Manager for production hardening.
  SeedAdminEmail:
    Type: String
    Description: Initial admin email for first-time bootstrap.
  SeedAdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Initial admin password for first-time bootstrap. Rotate after setup.
  GithubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      GitHub API token for listing open PRs. Optional — leave blank for public repos (subject to
      GitHub's lower unauthenticated rate limit); required for private repos.

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DeploymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deploymentId
          AttributeType: S
      KeySchema:
        - AttributeName: deploymentId
          KeyType: HASH

  DeploymentEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  LocksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lockKey
          AttributeType: S
      KeySchema:
        - AttributeName: lockKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: deployment-center-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !Sub "${UsersTable.Arn}/index/*"
                  - !GetAtt DeploymentsTable.Arn
                  - !GetAtt DeploymentEventsTable.Arn
                  - !GetAtt LocksTable.Arn
        - PolicyName: deployment-center-ecs-ecr
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                  - ecr:PutImage
                Resource:
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-be
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew_ai
                  - arn:aws:ecr:ap-south-1:741005527903:repository/resume-analyzer
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skb-payments
                  - arn:aws:ecr:ap-south-1:741005527903:repository/notification-api
                  - arn:aws:ecr:ap-south-1:741005527903:repository/notification-worker
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-agent
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-agent-daemon
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-reward
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-fe
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-app-fe
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-org-fe
                  - arn:aws:ecr:ap-south-1:741005527903:repository/skillbrew-fe-admin
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      - arn:aws:ecs:ap-south-1:741005527903:cluster/skillbrew-dev-cluster
                      - arn:aws:ecs:ap-south-1:741005527903:cluster/skillbrew-staging-cluster
                      - arn:aws:ecs:ap-south-1:741005527903:cluster/skillbrew-prod-cluster
              # TODO(doc 02): tighten to explicit task/execution role ARNs (e.g.
              # arn:aws:iam::741005527903:role/skillbrew-*-task-role /
              # skillbrew-*-execution-role) once those ARNs are supplied — not available yet.
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
        - PolicyName: deployment-center-self-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-api"

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Handler: lambda.handler
      Runtime: nodejs20.x
      Role: !GetAtt ApiRole.Arn
      # ECS waitForStable now polls for up to STABILITY_TIMEOUT_MS (default 600s) to tolerate a
      # cold ECR image pull on a fresh instance; the async deployment worker (self-invoked via
      # LambdaDeploymentTrigger, fire-and-forget with MaximumRetryAttempts 0) needs headroom beyond
      # that, so the ceiling is set to the Lambda maximum. The API-Gateway-facing request path
      # itself still returns in well under API Gateway's 30s hard timeout since POST /deployments
      # only does beginDeployment synchronously.
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          DATA_STORE: dynamodb
          AWS_INTEGRATION: aws
          STATIC_ASSETS_DIR: public
          JWT_SECRET: !Ref JwtSecret
          SEED_ADMIN_EMAIL: !Ref SeedAdminEmail
          SEED_ADMIN_PASSWORD: !Ref SeedAdminPassword
          USERS_TABLE_NAME: !Ref UsersTable
          DEPLOYMENTS_TABLE_NAME: !Ref DeploymentsTable
          DEPLOYMENT_EVENTS_TABLE_NAME: !Ref DeploymentEventsTable
          LOCKS_TABLE_NAME: !Ref LocksTable
          GITHUB_TOKEN: !Ref GithubToken

  ApiFunctionEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ApiFunction
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 0

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"
        AllowOrigins:
          - "*"

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  UsersTableName:
    Value: !Ref UsersTable
  DeploymentsTableName:
    Value: !Ref DeploymentsTable
  DeploymentEventsTableName:
    Value: !Ref DeploymentEventsTable
  LocksTableName:
    Value: !Ref LocksTable
