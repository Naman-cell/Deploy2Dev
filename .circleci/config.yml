version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.2

parameters:
  run_image_build:
    type: boolean
    default: false
  service_name:
    type: string
    default: sample-service
  ecr_repository:
    type: string
    default: deploy2dev/sample-service
  dockerfile:
    type: string
    default: sample-service/Dockerfile
  docker_context:
    type: string
    default: sample-service

jobs:
  quality-checks:
    docker:
      - image: cimg/node:20.17
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm run test
      - run:
          name: Build
          command: npm run build

  build-and-push-service-image:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - aws-cli/setup:
          region: AWS_REGION
      - run:
          name: Compute image tags
          command: |
            set -euo pipefail

            : "${AWS_REGION:?Missing AWS_REGION}"
            : "${AWS_ACCOUNT_ID:?Missing AWS_ACCOUNT_ID}"

            SHORT_SHA="$(echo "${CIRCLE_SHA1}" | cut -c1-7)"
            SAFE_BRANCH="$(echo "${CIRCLE_BRANCH:-manual}" | tr '/_[:upper:]' '--[:lower:]' | tr -cd 'a-z0-9.-')"
            DATE="$(date -u +%Y%m%d)"
            RUN="${CIRCLE_BUILD_NUM}"

            if [[ "<< pipeline.parameters.run_image_build >>" == "true" ]]; then
              TAGS="branch-${SAFE_BRANCH}-${SHORT_SHA},user-${CIRCLE_USERNAME:-circleci}-${SAFE_BRANCH}-${SHORT_SHA},sha-${SHORT_SHA},run-${RUN}"
            elif [[ "${CIRCLE_BRANCH:-}" == "dev" || "${CIRCLE_BRANCH:-}" == "stage" ]]; then
              TAGS="${CIRCLE_BRANCH}-${DATE}-${RUN}-${SHORT_SHA}"
            elif [[ "${CIRCLE_BRANCH:-}" == hotfix/* ]]; then
              TAGS="hotfix-${DATE}-${RUN}-${SHORT_SHA}"
            elif [[ "${CIRCLE_BRANCH:-}" == "prod" ]]; then
              echo "Normal stage-to-prod promotion should not build a new image."
              circleci-agent step halt
            else
              echo "Skipping image build for branch ${CIRCLE_BRANCH:-unknown}."
              circleci-agent step halt
            fi

            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            REPOSITORY="${REGISTRY}/<< pipeline.parameters.ecr_repository >>"

            {
              echo "export IMAGE_REPOSITORY=${REPOSITORY}"
              echo "export IMAGE_TAGS=${TAGS}"
            } >> "${BASH_ENV}"

            echo "Image repository: ${REPOSITORY}"
            echo "Image tags: ${TAGS}"
      - run:
          name: Login to ECR
          command: |
            set -euo pipefail
            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - run:
          name: Build image
          command: |
            set -euo pipefail
            source "${BASH_ENV}"
            ARGS=()
            for tag in $(printf '%s' "${IMAGE_TAGS}" | tr ',' ' '); do
              ARGS+=("-t" "${IMAGE_REPOSITORY}:${tag}")
            done
            docker build "${ARGS[@]}" -f "<< pipeline.parameters.dockerfile >>" "<< pipeline.parameters.docker_context >>"
      - run:
          name: Push image tags
          command: |
            set -euo pipefail
            source "${BASH_ENV}"
            for tag in $(printf '%s' "${IMAGE_TAGS}" | tr ',' ' '); do
              docker push "${IMAGE_REPOSITORY}:${tag}"
            done

workflows:
  heimdall-quality:
    jobs:
      - quality-checks

  manual-service-image-build:
    when: << pipeline.parameters.run_image_build >>
    jobs:
      - build-and-push-service-image

  branch-service-image-build:
    unless: << pipeline.parameters.run_image_build >>
    jobs:
      - build-and-push-service-image:
          filters:
            branches:
              only:
                - dev
                - stage
                - prod
                - /hotfix\/.*/
